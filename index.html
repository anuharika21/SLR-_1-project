<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary Prediction System</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            background:linear-gradient(135deg,#ffecd2,#fcb69f);
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .container{
            width:420px;
            background:#fff;
            padding:35px;
            border-radius:15px;
            box-shadow:0 15px 40px rgba(0,0,0,.2);
        }

        h1{
            text-align:center;
            color:#d35400;
            margin-bottom:10px;
        }

        p{
            text-align:center;
            color:#777;
            margin-bottom:25px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:600;
        }

        input{
            width:100%;
            padding:12px;
            border:2px solid #ddd;
            border-radius:8px;
            font-size:16px;
            margin-bottom:20px;
        }

        input:focus{
            outline:none;
            border-color:#ff6600;
        }

        button{
            width:100%;
            padding:14px;
            border:none;
            border-radius:8px;
            background:#ff6600;
            color:white;
            font-size:17px;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:#e65100;
        }

        .result{
            margin-top:25px;
            background:#ff6600;
            color:white;
            padding:18px;
            border-radius:10px;
            text-align:center;
        }

        .footer{
            text-align:center;
            margin-top:20px;
            color:#888;
            font-size:13px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Salary Prediction</h1>

    <p>Machine Learning Project</p>

    <form action="/predict" method="POST">

        <label>Years of Experience</label>

        <input
            type="number"
            name="experience"
            step="0.1"
            placeholder="Enter years of experience"
            required>

        <button type="submit">
            Predict Salary
        </button>

    </form>

    {% if prediction_text %}

    <div class="result">

        <h2>Predicted Salary</h2>

        <h3>₹ {{ prediction_text }}</h3>

    </div>

    {% endif %}

    <div class="footer">
        Developed by <b>Anu Harika</b>
    </div>

</div>

</body>
</html>
